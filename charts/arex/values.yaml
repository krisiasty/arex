# arex Helm values.
#
# The two things that must be set: config.switches, and a credential for them.

image:
  repository: ghcr.io/krisiasty/arex
  # Defaults to the chart's appVersion. Pin it here to hold a version
  # independently of chart upgrades.
  tag: ""
  pullPolicy: IfNotPresent

imagePullSecrets: []
nameOverride: ""
fullnameOverride: ""

# Where the switch password comes from.
#
# The chart never creates this Secret. If it did, and the External Secrets
# Operator also managed it, ArgoCD would fight ESO over the same object:
# perpetual OutOfSync, and the placeholder from git overwriting the synced
# value. Create it with an ExternalSecret, or by hand, and name it here.
credentials:
  # Name of an existing Secret holding the password.
  existingSecret: ""
  # Key within that Secret.
  key: password
  # Where it is mounted. The chart points config.passwordFile at
  # <mountPath>/<key> automatically, so it cannot be set inconsistently.
  mountPath: /etc/arex/secret

# Serving /metrics over TLS, and requiring callers to authenticate.
#
# Both are off by default: arex then serves plain HTTP, which is what an
# exporter on a trusted network usually does. Its metrics do carry your switch
# inventory -- names, serials, BGP peers -- so on a shared cluster they are
# worth turning on.
listen:
  tls:
    # Name a Secret holding tls.crt and tls.key, as cert-manager produces.
    # The chart mounts it and points listenTLS at the mounted paths.
    existingSecret: ""
    certKey: tls.crt
    keyKey: tls.key
    # Optional: a key in the same Secret holding a CA bundle. With it, clients
    # must present a certificate signed by that CA -- Prometheus authenticates
    # with a certificate and no shared secret is involved.
    clientCAKey: ""
    mountPath: /etc/arex/tls

  # A second listener serving only /livez and /readyz, in plain HTTP.
  #
  # Required with mutual TLS: RequireAndVerifyClientCert applies to a listener
  # rather than a path, and a kubelet probe presents no client certificate, so
  # without this the probes would have to drop to checking that the port is
  # open -- losing the readiness gate that waits for every switch to be polled
  # once. These two endpoints report only whether arex is up.
  probePort: 0

  basicAuth:
    # Name a Secret holding the scrape password.
    existingSecret: ""
    key: password
    username: prometheus
    mountPath: /etc/arex/web

# arex's own configuration, rendered into a ConfigMap verbatim. Everything the
# config file accepts goes here; see docs/configuration.md.
#
# passwordFile is managed by the chart when credentials.existingSecret is set.
config:
  listenAddress: ":9100"
  pollInterval: 30s
  scrapeTimeout: 10s
  stalenessLimit: 90s
  debug: false

  collect:
    processes:
      enabled: true
    temperature:
      enabled: true
    power:
      enabled: true
    cooling:
      enabled: true
    ntp:
      enabled: true
    capacity:
      enabled: true
    interfaces:
      enabled: true
    bgp:
      enabled: true
    transceiver:
      enabled: true
      interval: 5m
    phy:
      enabled: true
      interval: 15m

  # One entry per switch. A stock EOS switch can only be verified by pinning
  # its certificate; see docs/tls.md.
  switches: []
  # - host: https://10.10.0.11
  #   username: prometheus
  #   name: leaf1
  #   pinnedCertSha256: "A1:B2:..."

# One replica in steady state. arex has no leader election, so two running
# indefinitely would poll every switch twice and give Prometheus two series per
# switch to double-count.
replicaCount: 1

# How a new version replaces the old one.
#
# RollingUpdate with maxUnavailable 0 means the old pod keeps serving until the
# new one is Ready -- which for arex means every switch polled once -- so there
# is no gap in the series. The cost is a brief overlap, typically one poll
# interval, where both instances poll and Prometheus holds two series per
# switch.
#
# Set type: Recreate instead to avoid the overlap entirely, at the price of a
# gap: the old pod stops before the new one starts. Worth it only if something
# on the switch side objects to concurrent eAPI sessions.
strategy:
  type: RollingUpdate
  rollingUpdate:
    maxUnavailable: 0
    maxSurge: 1

service:
  type: ClusterIP
  port: 9100

serviceMonitor:
  # Requires prometheus-operator. Without it, scrape the Service directly.
  enabled: false
  interval: 30s
  scrapeTimeout: 10s
  # Extra labels, for a Prometheus whose serviceMonitorSelector needs them.
  labels: {}
  # scheme follows listen.tls on its own. These two say how Prometheus should
  # trust arex's certificate and authenticate to it -- secret references the
  # chart cannot infer. Passed through verbatim.
  #
  # tlsConfig:
  #   ca:
  #     secret: {name: arex-tls, key: ca.crt}
  #   serverName: arex.monitoring.svc
  # basicAuth:
  #   username: {name: arex-web-password, key: username}
  #   password: {name: arex-web-password, key: password}
  tlsConfig: {}
  basicAuth: {}
  relabelings: []
  metricRelabelings: []

serviceAccount:
  create: true
  name: ""
  annotations: {}

resources:
  requests:
    cpu: 50m
    memory: 64Mi
  limits:
    memory: 256Mi

# arex writes nothing and needs no privileges. The image already runs as
# 65532, and these make that explicit and enforced.
podSecurityContext:
  runAsNonRoot: true
  runAsUser: 65532
  runAsGroup: 65532
  fsGroup: 65532
  seccompProfile:
    type: RuntimeDefault

securityContext:
  allowPrivilegeEscalation: false
  readOnlyRootFilesystem: true
  capabilities:
    drop: ["ALL"]

# livez stays up while a switch is unreachable, since restarting arex would not
# fix a switch; it fails only if the poll loop stops. readyz waits until every
# switch has been polled once, so a fresh pod is not scraped before it has
# anything to serve.
livenessProbe:
  httpGet:
    path: /livez
    port: metrics
  periodSeconds: 30
  failureThreshold: 3

readinessProbe:
  httpGet:
    path: /readyz
    port: metrics
  periodSeconds: 10
  failureThreshold: 6

podAnnotations: {}
podLabels: {}
nodeSelector: {}
tolerations: []
affinity: {}
topologySpreadConstraints: []
priorityClassName: ""
extraArgs: []
extraVolumes: []
extraVolumeMounts: []
