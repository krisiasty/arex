apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "arex.fullname" . }}
  labels:
    {{- include "arex.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.replicaCount }}
  strategy:
    # Defaults to RollingUpdate with maxUnavailable 0, so the old pod serves
    # until the new one is Ready and no metrics are lost. See values.yaml for
    # the trade against a brief double-poll.
    {{- toYaml .Values.strategy | nindent 4 }}
  selector:
    matchLabels:
      {{- include "arex.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      annotations:
        # arex reads its config once, at startup. Without this the pod would
        # keep running the old config after a ConfigMap change -- so a switch
        # added in git would appear synced and not be polled.
        checksum/config: {{ include "arex.config" . | sha256sum }}
        {{- with .Values.podAnnotations }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
      labels:
        {{- include "arex.selectorLabels" . | nindent 8 }}
        {{- with .Values.podLabels }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
    spec:
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      serviceAccountName: {{ include "arex.serviceAccountName" . }}
      automountServiceAccountToken: false
      {{- with .Values.priorityClassName }}
      priorityClassName: {{ . }}
      {{- end }}
      securityContext:
        {{- toYaml .Values.podSecurityContext | nindent 8 }}
      containers:
        - name: arex
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag | default .Chart.AppVersion }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          args:
            - -config
            - /etc/arex/config.yaml
            {{- with .Values.extraArgs }}
            {{- toYaml . | nindent 12 }}
            {{- end }}
          ports:
            - name: metrics
              containerPort: 9100
              protocol: TCP
          securityContext:
            {{- toYaml .Values.securityContext | nindent 12 }}
          {{- /* The scheme has to follow listen.tls, or an httpGet probe fails
                 against a TLS listener. Only an httpGet probe has a scheme: a
                 tcpSocket or exec probe is left exactly as given, which is what
                 mutual TLS requires, since the kubelet presents no client
                 certificate and would be refused at the handshake. */}}
          {{- with .Values.livenessProbe }}
          livenessProbe:
            {{- include "arex.probe" (dict "probe" . "root" $) | nindent 12 }}
          {{- end }}
          {{- with .Values.readinessProbe }}
          readinessProbe:
            {{- include "arex.probe" (dict "probe" . "root" $) | nindent 12 }}
          {{- end }}
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
          volumeMounts:
            - name: config
              mountPath: /etc/arex
              readOnly: true
            {{- if .Values.credentials.existingSecret }}
            # No subPath: a subPath mount is populated once at pod start and
            # never updated, so a rotated secret would silently stop arriving.
            - name: credentials
              mountPath: {{ .Values.credentials.mountPath }}
              readOnly: true
            {{- end }}
            {{- if .Values.listen.tls.existingSecret }}
            - name: listen-tls
              mountPath: {{ .Values.listen.tls.mountPath }}
              readOnly: true
            {{- end }}
            {{- if .Values.listen.basicAuth.existingSecret }}
            - name: listen-auth
              mountPath: {{ .Values.listen.basicAuth.mountPath }}
              readOnly: true
            {{- end }}
            {{- with .Values.extraVolumeMounts }}
            {{- toYaml . | nindent 12 }}
            {{- end }}
      volumes:
        - name: config
          configMap:
            name: {{ include "arex.fullname" . }}
        {{- if .Values.credentials.existingSecret }}
        - name: credentials
          secret:
            secretName: {{ .Values.credentials.existingSecret }}
            defaultMode: 0400
        {{- end }}
        {{- if .Values.listen.tls.existingSecret }}
        - name: listen-tls
          secret:
            secretName: {{ .Values.listen.tls.existingSecret }}
            defaultMode: 0400
        {{- end }}
        {{- if .Values.listen.basicAuth.existingSecret }}
        - name: listen-auth
          secret:
            secretName: {{ .Values.listen.basicAuth.existingSecret }}
            defaultMode: 0400
        {{- end }}
        {{- with .Values.extraVolumes }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.topologySpreadConstraints }}
      topologySpreadConstraints:
        {{- toYaml . | nindent 8 }}
      {{- end }}
