{{- if not .Values.config.switches }}
{{- fail "config.switches is empty: arex has nothing to poll" }}
{{- end }}
{{- if not .Values.credentials.existingSecret }}
{{- range $i, $sw := .Values.config.switches }}
{{- if and (not $sw.password) (not $sw.passwordFile) }}
{{- fail (printf "switch %d (%s) has no credential: set credentials.existingSecret, or a password on the switch" $i (default $sw.host $sw.name)) }}
{{- end }}
{{- end }}
{{- end }}
{{- if and .Values.listen.tls.clientCAKey (not (gt (int .Values.listen.probePort) 0)) }}
{{- if or (kindIs "map" (get .Values.livenessProbe "httpGet")) (kindIs "map" (get .Values.readinessProbe "httpGet")) }}
{{- fail "listen.tls.clientCAKey requires listen.probePort: mutual TLS refuses the kubelet at the handshake, so an httpGet probe would fail and restart the pod. Set listen.probePort, or replace the probes with tcpSocket." }}
{{- end }}
{{- end }}
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "arex.fullname" . }}
  labels:
    {{- include "arex.labels" . | nindent 4 }}
data:
  config.yaml: |
    {{- include "arex.config" . | nindent 4 }}
