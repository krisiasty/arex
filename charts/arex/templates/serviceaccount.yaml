{{- if .Values.serviceAccount.create }}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "arex.serviceAccountName" . }}
  labels:
    {{- include "arex.labels" . | nindent 4 }}
  {{- with .Values.serviceAccount.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
# arex talks to switches, not to the API server: it needs no RBAC at all.
automountServiceAccountToken: false
{{- end }}
