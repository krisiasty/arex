# arex configuration. YAML, and JSON is accepted too, since JSON is valid YAML.
#
# Durations are Go duration strings: 30s, 5m, 1h.

listenAddress: ":9100"

# Serving /metrics over TLS, and requiring callers to authenticate. Both are
# optional; without them arex serves plain HTTP, which is the default.
#
# Its metrics carry the switch inventory -- names, serials, BGP peers, optic
# serials -- so on a shared network they are worth turning on.
#
# listenTLS:
#   certFile: /etc/arex/tls/tls.crt
#   keyFile: /etc/arex/tls/tls.key
#   # With a client CA, callers must present a certificate signed by it and no
#   # shared secret is involved at all.
#   clientCAFile: /etc/arex/tls/ca.crt
#
# listenAuth:
#   basic:
#     username: prometheus
#     # A file, like the switch credentials: deliverable by systemd or a
#     # Kubernetes secret, and re-read after a rejection so a rotation needs
#     # no restart. /livez and /readyz are never covered.
#     passwordFile: /run/credentials/arex.service/web-password
#
# With mutual TLS the kubelet cannot reach /livez -- a client certificate is
# required by the listener, not by the path -- so the probes need a plain
# listener of their own. It serves those two endpoints and nothing else.
#
# probeAddress: ":9101"
pollInterval: 30s
scrapeTimeout: 10s
stalenessLimit: 90s
debug: false

# The credential file for every switch that does not name its own. Under
# systemd this is where LoadCredential= puts it; in Kubernetes, point it at a
# mounted secret. See the Credentials section of the README.
passwordFile: /run/credentials/arex.service/switch-password

# Collection is opt-in: a group not listed here is not collected. Each group is
# an object with a required "enabled" and an optional "interval"; without one,
# the group's default applies -- pollInterval for most, 5m for transceiver and
# 15m for phy, because optical power drifts over days and the PHY's FEC
# registers are not refreshed on a timer at all.
collect:
  processes:
    enabled: true
  temperature:
    enabled: true
  power:
    enabled: true
  cooling:
    enabled: true
  ntp:
    enabled: true
  capacity:
    enabled: true
  # Overlay groups are role-specific. Enable vxlan only where Vxlan1 exists,
  # evpn only where the EVPN address family runs, and esi only on switches
  # terminating ESI multihoming.
  vxlan:
    enabled: false
  evpn:
    enabled: false
  esi:
    enabled: false
  interfaces:
    enabled: true
  # Enable only on switches running BGP.
  bgp:
    enabled: false
  transceiver:
    enabled: true
    interval: 5m
  phy:
    enabled: true
    interval: 15m

switches:
  # One instance accepts at most 1,000 switches. This is a defensive ceiling,
  # not tested capacity; split large fleets across separate arex instances.
  # A stock EOS switch serves a certificate with no subject alternative names,
  # so it can only be verified by pinning. See the TLS section of the README.
  # This spine inherits the conservative global collect set. A route reflector
  # would use a per-switch block to enable bgp and evpn, while leaving vxlan and
  # esi disabled.
  - host: https://192.0.2.11
    username: prometheus
    name: spine1
    pinnedCertSha256: "A1:B2:C3:D4:E5:F6:07:18:29:3A:4B:5C:6D:7E:8F:90:A1:B2:C3:D4:E5:F6:07:18:29:3A:4B:5C:6D:7E:8F:90"

  # Once the switch serves a certificate with correct SANs, verify against its
  # CA instead. This leaf runs BGP, EVPN, Vxlan1 and ESI multihoming, so its
  # per-switch collect block adds those modules to the global set, changes the
  # transceiver interval, and disables phy for this switch.
  - host: https://192.0.2.12
    username: prometheus
    name: leaf1
    # Required when one arex instance monitors more than one independent EVPN
    # fabric. Use the same value on every switch in this fabric.
    fabric: fabric-a
    caFile: /etc/arex/switch-ca.pem
    interfaceScope: Ethernet1/1-4,Ethernet2/1-4,Ethernet29/1-4
    collect:
      vxlan:
        enabled: true
      evpn:
        enabled: true
      esi:
        enabled: true
      bgp:
        enabled: true
      transceiver:
        enabled: true
        interval: 1m
      phy:
        enabled: false

  # A switch with its own account: an inline password wins over passwordFile.
  # Skipping verification is a per-switch decision, so it is stated here on the
  # switch it applies to rather than once for the fleet.
  - host: https://192.0.2.13
    username: prometheus
    password: a-switch-with-its-own-account
    name: leaf2
    tlsSkipVerify: true
