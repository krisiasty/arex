# arex configuration. YAML, and JSON is accepted too, since JSON is valid YAML.
#
# Durations are Go duration strings: 30s, 5m, 1h.

listenAddress: ":9100"
pollInterval: 30s
scrapeTimeout: 10s
stalenessLimit: 90s
debug: false

# The credential file for every switch that does not name its own. Under
# systemd this is where LoadCredential= puts it; in Kubernetes, point it at a
# mounted secret. See the Credentials section of the README.
passwordFile: /run/credentials/arex.service/switch-password

# Collection is opt-in: a group not listed here is not collected. Each group is
# an object with a required "enabled" and an optional "interval"; without one,
# the group's default applies -- pollInterval for most, 5m for transceiver and
# 15m for phy, because optical power drifts over days and the PHY's FEC
# registers are not refreshed on a timer at all.
collect:
  processes:
    enabled: true
  temperature:
    enabled: true
  power:
    enabled: true
  cooling:
    enabled: true
  interfaces:
    enabled: true
  bgp:
    enabled: true
  transceiver:
    enabled: true
    interval: 5m
  phy:
    enabled: true
    interval: 15m

switches:
  # A stock EOS switch serves a certificate with no subject alternative names,
  # so it can only be verified by pinning. See the TLS section of the README.
  - host: https://192.0.2.11
    username: prometheus
    name: spine1
    pinnedCertSha256: "A1:B2:C3:D4:E5:F6:07:18:29:3A:4B:5C:6D:7E:8F:90:A1:B2:C3:D4:E5:F6:07:18:29:3A:4B:5C:6D:7E:8F:90"

  # Once the switch serves a certificate with correct SANs, verify against its
  # CA instead. A per-switch collect block replaces the top-level one wholesale.
  - host: https://192.0.2.12
    username: prometheus
    name: leaf1
    caFile: /etc/arex/switch-ca.pem
    interfaceScope: Ethernet1/1-4,Ethernet2/1-4,Ethernet29/1-4
    collect:
      processes:
        enabled: true
      temperature:
        enabled: true
      power:
        enabled: true
      cooling:
        enabled: true
      interfaces:
        enabled: true
      bgp:
        enabled: false
      transceiver:
        enabled: true
        interval: 1m
      phy:
        enabled: false

  # A switch with its own account: an inline password wins over passwordFile.
  - host: https://192.0.2.13
    username: prometheus
    password: a-switch-with-its-own-account
    name: leaf2

tlsSkipVerify: true
