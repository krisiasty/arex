name: Feature request
description: Propose a new metric, platform capability, or operational improvement
title: "feat: "
labels:
  - enhancement
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What operational problem cannot be solved with the current metrics or configuration?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed behavior
      description: Describe the command, metric, configuration, or workflow you would add.
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
      description: Include PromQL or existing metric combinations if they can partly solve the problem.
  - type: textarea
    id: eos
    attributes:
      label: Relevant EOS output
      description: If applicable, include anonymized JSON output and the EOS version that produced it.
      render: text
  - type: checkboxes
    id: privacy
    attributes:
      label: Data handling
      options:
        - label: Any attached switch output is fully anonymized.
          required: true
