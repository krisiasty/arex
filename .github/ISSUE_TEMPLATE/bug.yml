name: Bug report
description: Report reproducible incorrect behavior in arex
title: "bug: "
labels:
  - bug
body:
  - type: markdown
    attributes:
      value: |
        Do not report security vulnerabilities here. Use the private reporting link on the Security tab.
        Remove credentials and every site-specific identifier from configurations, logs, and EOS output.
  - type: input
    id: version
    attributes:
      label: arex version
      description: Paste the complete output of `arex -version`.
      placeholder: arex v0.7.0, revision ..., built ..., go1.27.0
    validations:
      required: true
  - type: input
    id: eos
    attributes:
      label: EOS version and platform
      placeholder: EOS 4.x on an anonymized platform model
    validations:
      required: true
  - type: dropdown
    id: deployment
    attributes:
      label: Deployment
      options:
        - Binary or systemd
        - Kubernetes or Helm
        - Container without Helm
        - Other
    validations:
      required: true
  - type: textarea
    id: behavior
    attributes:
      label: What happened?
      description: Describe the observed behavior, expected behavior, and impact.
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: How can it be reproduced?
      description: Provide the smallest repeatable sequence and a redacted configuration.
    validations:
      required: true
  - type: textarea
    id: evidence
    attributes:
      label: Relevant logs or output
      description: Paste redacted logs, metrics, or EOS JSON output. Use code fences for structured text.
      render: text
  - type: checkboxes
    id: checks
    attributes:
      label: Safety checks
      options:
        - label: I have removed credentials, certificate material, and site-specific identifiers.
          required: true
        - label: I have confirmed that this is not a security vulnerability.
          required: true
