name: ci

on:
  push:
    branches: ["**"]
  pull_request:
    branches: ["**"]
  schedule:
    - cron: "0 8 * * 1"  # weekly on monday — catches newly published vulnerabilities
  workflow_dispatch: {}

permissions:
  contents: read

# Every external action is pinned to a full commit SHA rather than a tag,
# because a tag is movable: whoever can push one can change what runs here, and
# this workflow's sibling holds the token that publishes releases. The trailing
# comment is the release that SHA is.
#
# Tool versions an action downloads are pinned too, since a pinned action that
# fetches "latest" still runs unreviewed code.
jobs:
  check:
    name: check
    runs-on: ubuntu-latest

    steps:
      - name: checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: setup go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true

      - name: go mod tidy
        run: |
          go mod tidy
          git diff --exit-code go.mod go.sum

      - name: go mod verify
        run: go mod verify

      # The notices are generated from the build graph, so a dependency added
      # without regenerating would ship an image whose notices are incomplete.
      # Same idea as the tidy check above: the artifact is committed, and CI
      # proves it is current.
      - name: third-party notices are current
        run: |
          ./hack/gen-notices.sh
          git diff --exit-code -- internal/legal/THIRD_PARTY_NOTICES
          git ls-files --error-unmatch internal/legal/THIRD_PARTY_NOTICES

      # The per-consumer rule files are generated from monitoring/alerts.yaml.
      # Editing one of them directly would work until the next regeneration
      # silently reverted it.
      - name: monitoring rules are current
        run: |
          ./hack/gen-monitoring.sh
          git diff --exit-code -- monitoring/

      - name: shellcheck
        run: shellcheck hack/*.sh

      - name: go build
        run: go build ./...

      - name: go test
        run: go test -race ./...

      # The seed corpora run as ordinary tests above. This is a short live fuzz
      # of the three paths where arbitrary input reaches arex: the config file,
      # the eAPI decoders on the poll goroutines, and label rendering. Short
      # because it runs on every push -- it is a regression net, not a campaign.
      - name: fuzz the input paths
        run: |
          set -euo pipefail
          go test ./config/ -run FuzzLoad -fuzz FuzzLoad -fuzztime 30s
          go test ./internal/collector/ -run FuzzCollect -fuzz FuzzCollect -fuzztime 30s
          go test ./internal/metrics/ -run FuzzRender -fuzz FuzzRender -fuzztime 30s

      - name: golangci-lint
        uses: golangci/golangci-lint-action@ba0d7d2ec06a0ea1cb5fa41b2e4a3ab91d21278a # v9.3.0
        with:
          version: v2.13.2
          args: -v

      # Pinning the scanner does not stale what it finds: the vulnerability
      # database is fetched from vuln.go.dev at run time, so a bump improves the
      # analysis, never the data.
      - name: govulncheck
        run: go run golang.org/x/vuln/cmd/govulncheck@v1.7.0 ./...

      - name: markdownlint
        uses: DavidAnson/markdownlint-cli2-action@21c1be1b93ad9ed58fa840aacc3f279cde2a72ff # v24.2.0
        with:
          globs: "**/*.md"

      - name: typos
        uses: crate-ci/typos@8a48f81b6c64dcfea44b3633223084c4be58ac5f # v1.49.0

      - name: actionlint
        uses: raven-actions/actionlint@3d39aea434753780c3b3d4a1a31c854b4dbf49d7 # v2.2.0
        with:
          version: 1.7.12

      # The manifest's config is the example people copy, so it has to still
      # load. Extracted by dedenting the block scalar -- no YAML library
      # needed, which keeps the check working on any runner.
      - name: deployment manifests are valid
        run: |
          set -euo pipefail
          printf 'hunter2\n' > "${RUNNER_TEMP}/manifest-password"
          chmod 600 "${RUNNER_TEMP}/manifest-password"
          python3 - "${RUNNER_TEMP}" <<'PY'
          import sys, textwrap
          tmp = sys.argv[1]
          lines = open('deploy/kubernetes.yaml').read().split('\n')
          i = next(n for n, l in enumerate(lines) if l.strip() == 'config.yaml: |')
          block = []
          for line in lines[i + 1:]:
              if line.strip() and not line.startswith('    '):
                  break
              block.append(line)
          config = textwrap.dedent('\n'.join(block))
          # Placeholders a real deployment replaces, substituted so the config
          # can actually be validated here.
          config = config.replace('REPLACE_WITH_THE_SWITCH_FINGERPRINT', 'A1:' * 31 + 'B2')
          config = config.replace('/etc/arex/secret/password', f'{tmp}/manifest-password')
          with open(f'{tmp}/manifest-config.yaml', 'w') as f:
              f.write(config)
          PY
          go run . -check -config "${RUNNER_TEMP}/manifest-config.yaml"

      - name: go vet
        run: go vet ./...

  # The chart is checked separately: it needs helm rather than Go, and a
  # template that renders locally but was never committed would otherwise only
  # be discovered by whoever installed it next.
  chart:
    name: chart
    runs-on: ubuntu-latest

    steps:
      - name: checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: setup go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true

      - name: setup helm
        uses: azure/setup-helm@9bc31f4ebc9c6b171d7bfbaa5d006ae7abdb4310 # v5.0.1
        with:
          version: v4.2.4

      - name: write minimal values
        run: |
          cat > "${RUNNER_TEMP}/values.yaml" <<'YAML'
          credentials:
            existingSecret: arex-switch-password
          config:
            switches:
              - host: https://10.10.0.11
                username: prometheus
                name: leaf1
                pinnedCertSha256: "REPLACE"
          YAML

      - name: helm lint
        run: helm lint charts/arex -f "${RUNNER_TEMP}/values.yaml"

      # A chart that renders nothing to poll, or renders a switch with no
      # credential, is a mistake worth catching at template time rather than at
      # the first scrape.
      - name: the chart refuses an unusable config
        run: |
          set -euo pipefail
          if helm template arex charts/arex >/dev/null 2>&1; then
            echo "::error::rendering succeeded with no switches"
            exit 1
          fi
          if helm template arex charts/arex \
               --set 'config.switches[0].host=h' \
               --set 'config.switches[0].username=u' >/dev/null 2>&1; then
            echo "::error::rendering succeeded for a switch with no credential"
            exit 1
          fi

      - name: the chart ships every object it claims to
        run: |
          set -euo pipefail
          rendered=$(helm template arex charts/arex -n monitoring -f "${RUNNER_TEMP}/values.yaml")
          for kind in ConfigMap Deployment Service ServiceAccount; do
            if ! grep -qx "kind: ${kind}" <<<"${rendered}"; then
              echo "::error::the chart rendered no ${kind}"
              exit 1
            fi
          done
          # Off by default, so the step above cannot see it: a template that was
          # never committed would render fine locally and vanish here.
          if grep -qx "kind: ServiceMonitor" <<<"${rendered}"; then
            echo "::error::a ServiceMonitor was rendered without serviceMonitor.enabled"
            exit 1
          fi
          with_sm=$(helm template arex charts/arex -n monitoring -f "${RUNNER_TEMP}/values.yaml" \
            --set serviceMonitor.enabled=true)
          if ! grep -qx "kind: ServiceMonitor" <<<"${with_sm}"; then
            echo "::error::serviceMonitor.enabled=true rendered no ServiceMonitor"
            exit 1
          fi
          # The chart must never own the Secret: ESO or an operator does, and
          # two managers of one object fight over it.
          if grep -qx "kind: Secret" <<<"${with_sm}"; then
            echo "::error::the chart rendered a Secret"
            exit 1
          fi

      # maxUnavailable 0 is what makes an upgrade lossless: the old pod serves
      # until the new one is Ready. A default that quietly became 1, or a
      # Recreate strategy, would introduce a gap in the series on every deploy.
      - name: an upgrade does not drop metrics
        run: |
          set -euo pipefail
          rendered=$(helm template arex charts/arex -n monitoring -f "${RUNNER_TEMP}/values.yaml")
          if ! grep -q "type: RollingUpdate" <<<"${rendered}"; then
            echo "::error::the default strategy is not RollingUpdate"
            exit 1
          fi
          if ! grep -q "maxUnavailable: 0" <<<"${rendered}"; then
            echo "::error::maxUnavailable is not 0, so an upgrade would leave a gap"
            exit 1
          fi

      # arex reads its config once, at startup, so a ConfigMap change that does
      # not roll the pod would report Synced while changing nothing.
      - name: a config change rolls the pod
        run: |
          set -euo pipefail
          before=$(helm template arex charts/arex -n monitoring -f "${RUNNER_TEMP}/values.yaml" \
            | grep -o 'checksum/config: .*')
          after=$(helm template arex charts/arex -n monitoring -f "${RUNNER_TEMP}/values.yaml" \
            --set config.pollInterval=60s | grep -o 'checksum/config: .*')
          if [[ "${before}" == "${after}" ]]; then
            echo "::error::checksum/config did not change with the config"
            exit 1
          fi

      # A TLS listener whose probes still say HTTP fails every health check, and
      # a ServiceMonitor still scraping http gets nothing. Both follow
      # listen.tls, so both are asserted -- here without mutual TLS, where the
      # probes share the metrics listener and must therefore use HTTPS too.
      - name: TLS turns the whole endpoint over
        run: |
          set -euo pipefail
          cat > "${RUNNER_TEMP}/tls-values.yaml" <<'YAML'
          credentials:
            existingSecret: arex-switch-password
          listen:
            tls:
              existingSecret: arex-tls
            basicAuth:
              existingSecret: arex-web-password
          serviceMonitor:
            enabled: true
          config:
            switches:
              - host: https://10.10.0.11
                username: prometheus
                name: leaf1
                pinnedCertSha256: "REPLACE"
          YAML
          rendered=$(helm template arex charts/arex -n monitoring -f "${RUNNER_TEMP}/tls-values.yaml")
          for want in "scheme: HTTPS" "scheme: https" "listenTLS:" "listenAuth:"; do
            if ! grep -qF "${want}" <<<"${rendered}"; then
              echo "::error::TLS values did not produce ${want}"
              exit 1
            fi
          done
          # And with TLS off, nothing of the sort appears.
          plain=$(helm template arex charts/arex -n monitoring -f "${RUNNER_TEMP}/values.yaml")
          if grep -qF "scheme: HTTPS" <<<"${plain}"; then
            echo "::error::probes say HTTPS without listen.tls"
            exit 1
          fi

      # Mutual TLS refuses the kubelet at the handshake. The chart must refuse
      # that combination rather than render a pod that restart-loops, and must
      # wire the probes to the plain probe port when one is given.
      - name: mutual TLS requires a probe port
        run: |
          set -euo pipefail
          cat > "${RUNNER_TEMP}/mtls-values.yaml" <<'YAML'
          credentials:
            existingSecret: arex-switch-password
          listen:
            tls:
              existingSecret: arex-tls
              clientCAKey: ca.crt
          config:
            switches:
              - host: https://10.10.0.11
                username: prometheus
                name: leaf1
                pinnedCertSha256: "REPLACE"
          YAML
          if helm template arex charts/arex -n monitoring -f "${RUNNER_TEMP}/mtls-values.yaml" >/dev/null 2>&1; then
            echo "::error::mutual TLS rendered with httpGet probes and no probe port"
            exit 1
          fi

          rendered=$(helm template arex charts/arex -n monitoring \
            -f "${RUNNER_TEMP}/mtls-values.yaml" --set listen.probePort=9101)
          for want in "probeAddress: :9101" "containerPort: 9101" "port: probes" "clientCAFile:"; do
            if ! grep -qF "${want}" <<<"${rendered}"; then
              echo "::error::a probe port did not produce ${want}"
              exit 1
            fi
          done
          # The probes must be plain HTTP even though the metrics endpoint is not.
          if grep -A4 "Probe:" <<<"${rendered}" | grep -q "scheme: HTTPS"; then
            echo "::error::probes point at HTTPS despite a plain probe listener"
            exit 1
          fi

      # Mutual TLS refuses the kubelet at the handshake, so the probes have to
      # become tcpSocket -- and Helm merges maps, so a probe can end up with
      # two handlers, which Kubernetes rejects outright.
      - name: a probe never carries two handlers
        run: |
          set -euo pipefail
          cat > "${RUNNER_TEMP}/tcp-values.yaml" <<'YAML'
          credentials:
            existingSecret: arex-switch-password
          livenessProbe:
            httpGet: null
            tcpSocket:
              port: metrics
          readinessProbe:
            httpGet: null
            tcpSocket:
              port: metrics
          config:
            switches:
              - host: https://10.10.0.11
                username: prometheus
                name: leaf1
                pinnedCertSha256: "REPLACE"
          YAML
          rendered=$(helm template arex charts/arex -n monitoring -f "${RUNNER_TEMP}/tcp-values.yaml")
          probes=$(sed -n '/Probe:/,/resources:/p' <<<"${rendered}")
          if grep -q "httpGet:" <<<"${probes}"; then
            echo "::error::httpGet survived being nulled out; the probe would carry two handlers"
            exit 1
          fi
          if ! grep -q "tcpSocket:" <<<"${probes}"; then
            echo "::error::the tcpSocket override did not render"
            exit 1
          fi

      # The rendered config is what arex actually has to load, so load it.
      - name: the rendered config is valid
        run: |
          set -euo pipefail
          printf 'hunter2\n' > "${RUNNER_TEMP}/password"
          chmod 600 "${RUNNER_TEMP}/password"
          helm template arex charts/arex -n monitoring -f "${RUNNER_TEMP}/values.yaml" > "${RUNNER_TEMP}/r.yaml"
          python3 - "${RUNNER_TEMP}" <<'PY'
          import sys, textwrap
          tmp = sys.argv[1]
          lines = open(f'{tmp}/r.yaml').read().split('\n')
          i = next(n for n, l in enumerate(lines) if l.strip() == 'config.yaml: |')
          block = []
          for line in lines[i + 1:]:
              if line.strip() and not line.startswith('    '):
                  break
              block.append(line)
          cfg = textwrap.dedent('\n'.join(block))
          cfg = cfg.replace('pinnedCertSha256: REPLACE', 'pinnedCertSha256: "' + 'A1:' * 31 + 'B2"')
          cfg = cfg.replace('/etc/arex/secret/password', f'{tmp}/password')
          open(f'{tmp}/config.yaml', 'w').write(cfg)
          PY
          go run . -check -config "${RUNNER_TEMP}/config.yaml"

  # Publishing the chart on merge is what decouples its cadence from arex's: a
  # chart-only fix ships when it lands rather than waiting for the next version
  # tag, which used to be the only trigger that published anything.
  #
  # needs: chart is the gate. This runs unattended and a published chart version
  # cannot be taken back, so it goes out only after the lint, the
  # refuses-an-unusable-config assertions and the rendered-config load have all
  # passed on this commit. The script skips any version already in the registry,
  # so the usual outcome on a merge that did not touch the chart is a no-op.
  publish-chart:
    name: publish chart
    needs: chart
    # The repository guard keeps a fork's own main from failing this job on a
    # registry it has no business pushing to.
    if: >-
      github.event_name == 'push' && github.ref == 'refs/heads/main'
      && github.repository == 'krisiasty/arex'
    runs-on: ubuntu-latest

    permissions:
      contents: read
      packages: write  # push to ghcr.io

    steps:
      - name: checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: setup helm
        uses: azure/setup-helm@9bc31f4ebc9c6b171d7bfbaa5d006ae7abdb4310 # v5.0.1
        with:
          version: v4.2.4

      # --password-stdin rather than a flag: an argument is visible in the
      # process list of everything else running on the runner.
      - name: log in to ghcr.io
        run: printf '%s\n' "${GITHUB_TOKEN}" |
          helm registry login ghcr.io --username "${GITHUB_ACTOR}" --password-stdin
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: publish charts
        run: ./hack/publish-charts.sh
